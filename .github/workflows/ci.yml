name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inspower
          POSTGRES_PASSWORD: inspower
          POSTGRES_DB: inspower_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inspower" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://inspower:inspower@127.0.0.1:5432/inspower_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/1
      AUTH_ENCRYPTION_KEY: change-me
      BACKUP_ENCRYPTION_KEY: change-me
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inspower/api db:generate
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true

  e2e:
    name: Browser tests (phone, tablet, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    if: ${{ hashFiles('apps/web/e2e/**/*.spec.ts') != '' }}
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: inspower, POSTGRES_PASSWORD: inspower, POSTGRES_DB: inspower }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U inspower" --health-interval 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://inspower:inspower@127.0.0.1:5432/inspower?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      AUTH_ENCRYPTION_KEY: change-me
      BACKUP_ENCRYPTION_KEY: change-me
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inspower/api db:generate
      - run: pnpm db:deploy
      - run: pnpm build
      - run: pnpm --filter @inspower/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  image:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Version
        id: version
        run: echo "value=$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          load: true
          tags: inspower:${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image roles
        run: |
          docker run --rm inspower:${{ steps.version.outputs.value }} cli version
          docker run --rm --entrypoint sh inspower:${{ steps.version.outputs.value }} -c 'ls /app/api/dist/main.js /app/api/dist/worker/main.js /app/web/apps/web/server.js'
