# nginx site for one Inspower client on a shared server where nginx already owns ports 80 and 443.
# Copy to /etc/nginx/sites-available/<domain>.conf, replace the three values below, enable it,
# then run certbot (docs/runbooks/deploy-to-shared-vps.md).
#
#   DOMAIN    test.inspowerdatahub.com
#   WEB_PORT  the client's WEB_HOST_PORT from clients/<slug>/.env (for example 3101)
#   API_PORT  the client's API_HOST_PORT from clients/<slug>/.env (for example 4101)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # certbot --nginx adds the HTTPS server block and the redirect below this line.

    client_max_body_size 10m;

    # Live updates (Socket.IO) go straight to the API and need the WebSocket upgrade.
    location /api/v1/realtime {
        proxy_pass http://127.0.0.1:API_PORT;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Everything else goes to the web app, which forwards /api/* to the API itself.
    location / {
        proxy_pass http://127.0.0.1:WEB_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
